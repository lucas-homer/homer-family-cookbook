name: Set up site
description: Install Node and pnpm, then install the workspace's dependencies from the lockfile.
runs:
  using: composite
  steps:
    # Reads the pnpm version from "packageManager" in package.json.
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
